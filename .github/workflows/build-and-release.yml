name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*' # Tự động kích hoạt khi tạo tag mới (ví dụ: git tag v1.0.1 && git push origin v1.0.1)

permissions:
  contents: write # Cấp quyền ghi để GitHub Actions có thể tạo Release và upload file .exe

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React Frontend
        run: npm run build

      - name: Build & Publish Installer to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
